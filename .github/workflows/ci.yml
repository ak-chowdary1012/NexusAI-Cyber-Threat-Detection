name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history to scan past commits, not just the working tree
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ml-core-tests:
    name: ML core pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline tests
        run: pytest tests/ -v

  backend-tests:
    name: Secure platform backend tests (auth + IDOR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ml_core dependencies (ml_bridge imports src.*)
        run: pip install -r requirements.txt
      - name: Install backend dependencies
        run: pip install -r platform/backend/requirements.txt
      - name: Train a quick checkpoint on synthetic data
        # forecast/copilot IDOR tests exercise the real inference path end
        # to end (see tests/test_idor.py) rather than mocking it, so a
        # checkpoint has to exist before they run — a couple of epochs on
        # the bundled synthetic set is enough and keeps CI fast.
        run: python -m src.train --epochs 3
      - name: Run backend tests
        working-directory: platform/backend
        run: pytest tests/ -v

  docker-build:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    needs: [ml-core-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Train a checkpoint so the image build has something to COPY
        run: |
          pip install -r requirements.txt
          python -m src.train --epochs 3
      - name: Build backend image
        run: docker build -f platform/backend/Dockerfile -t nexusai-backend:ci .
