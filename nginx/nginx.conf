# Author: Avinash Krishna — Team AVV Elites (SIH26153)
# nginx/nginx.conf
# SECURITY.md ref: §3 — "Enforce HTTPS". Port 80 does nothing but redirect;
# all real traffic is served over TLS on 443 and proxied to the backend
# service, which is not itself reachable from outside this network (see
# docker-compose.yml).

events {
    worker_connections 1024;
}

http {
    # Basic DoS resistance at the edge, ahead of the application-level rate
    # limiter in app/rate_limit.py — a second layer, not a replacement.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 55M;  # slightly above app/config.py's max_upload_mb=50 so the
        # application's own limit (which returns a clean 413 with a JSON body) is what
        # actually triggers, rather than nginx's blunter connection-reset behavior.

        limit_req zone=general burst=40 nodelay;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
